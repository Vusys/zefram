name: Infection

on:
  pull_request:

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with: { php-version: '8.2', coverage: pcov, tools: composer:v2 }
      - run: composer update --prefer-dist --no-interaction --no-progress
      # Infection's own default diff base is origin/master; this repo's default branch is
      # main, not master (unlike some sibling repos in the family) — spell it out rather
      # than hitting "fatal: bad revision 'origin/master'" on every PR.
      - run: vendor/bin/infection --git-diff-lines --git-diff-base=origin/main --logger-github --threads=max
