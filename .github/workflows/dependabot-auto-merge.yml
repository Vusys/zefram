name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch bumps auto-merge for everything; minor bumps only for
      # direct:development dependencies; production minors and all majors
      # keep a human review.
      - name: Decide whether to auto-merge
        id: decide
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          should_merge=false
          if [ "${UPDATE_TYPE}" = "version-update:semver-patch" ]; then
            should_merge=true
          elif [ "${UPDATE_TYPE}" = "version-update:semver-minor" ] && [ "${DEPENDENCY_TYPE}" = "direct:development" ]; then
            should_merge=true
          fi
          echo "should_merge=${should_merge}" >> "${GITHUB_OUTPUT}"

      - name: Enable auto-merge
        if: steps.decide.outputs.should_merge == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${PR_URL}"
