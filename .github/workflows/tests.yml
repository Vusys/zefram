name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Dependabot's github-actions PRs only ever touch action SHAs, never PHP —
    # skip the (expensive) matrix on those branches; actionlint is what
    # actually validates that kind of change.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/github_actions/')) }}
    runs-on: ubuntu-latest
    name: "PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}${{ matrix.paratest && ' / paratest' || '' }}"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        phpunit: ['11.5', '12.0', '13.0']
        paratest: [true, false]
        exclude:
          # PHPUnit 12 requires PHP >= 8.3.
          - php: '8.2'
            phpunit: '12.0'
          # PHPUnit 13 requires PHP >= 8.4.1.
          - php: '8.2'
            phpunit: '13.0'
          - php: '8.3'
            phpunit: '13.0'
          # brianium/paratest ^7.20 requires PHP >= 8.3 *and* phpunit/phpunit
          # ^12.5.14 || ^13.0.5 (confirmed empirically — no ^7.20 release
          # supports PHP 8.2 or the PHPUnit 11.x line). Both constraints are
          # already implied by the PHP-8.2/PHPUnit-12.0 exclusion above once
          # this exclusion is added, but spelling it out here documents *why*
          # paratest is never installed for an 11.5 cell. See the note on #17.
          - phpunit: '11.5'
            paratest: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Require PHPUnit ^${{ matrix.phpunit }}
        run: composer require "phpunit/phpunit:^${{ matrix.phpunit }}" --no-update --no-interaction

      # brianium/paratest isn't in the base require-dev at all (it can't
      # install on PHP 8.2, this package's own floor — see #42) — pull it in
      # just-in-time only for the cells that actually exercise it.
      - name: Require paratest
        if: matrix.paratest
        run: composer require --dev "brianium/paratest:^7.20" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Cache Zefram
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zefram
          key: zefram-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock', 'phpunit.xml') }}
          restore-keys: |
            zefram-${{ runner.os }}-php${{ matrix.php }}-

      - name: Run unit suite (paratest)
        if: matrix.paratest
        run: vendor/bin/paratest --configuration phpunit.xml

      - name: Run unit suite
        if: ${{ !matrix.paratest }}
        # Coverage on one representative cell only (#68, the family convention from #36).
        run: composer test -- ${{ matrix.php == '8.4' && matrix.phpunit == '13.0' && '--coverage-clover=coverage.xml' || '' }}

      - name: Upload coverage to Codecov
        if: ${{ !matrix.paratest && matrix.php == '8.4' && matrix.phpunit == '13.0' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run e2e suite
        run: composer test:e2e

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis & code style
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
      - run: vendor/bin/rector process --dry-run --no-progress-bar
      - run: vendor/bin/pint --test

  actionlint:
    runs-on: ubuntu-latest
    name: Lint workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  gate:
    needs: [test, static-analysis, actionlint]
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    name: CI gate
    steps:
      - name: Require every upstream job to have passed or been skipped
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          for r in ${results}; do
            if [ "${r}" = "failure" ] || [ "${r}" = "cancelled" ]; then
              echo "::error::a required job did not pass (result=${r})"
              exit 1
            fi
          done
