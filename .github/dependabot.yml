version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/London }
    open-pull-requests-limit: 10
    labels: [dependencies, composer]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Zefram deliberately supports two PHPUnit majors at once (`^11.5 || ^12.0`,
      # exercised by the CI matrix) — an unattended major bump would silently
      # narrow that range. Keep major PHPUnit bumps as human-reviewed PRs.
      - dependency-name: "phpunit/phpunit"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/London }
    labels: [dependencies, github-actions]
    groups:
      actions:
        update-types: [minor, patch]
